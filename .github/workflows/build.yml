name: Build & Push to GHCR

# Mirrors iq-gateway's pipeline: build a Bun image, push to GHCR, then SSH-deploy
# to the prod host (command-restricted key → can only redeploy this one service).
# Deploy step is wired but inert until the prod secrets are set on this repo.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Skip the provenance/SBOM attestation index — it uses media types
          # older container runtimes 404 on (iq-gateway hit this). Plain
          # manifest v2 = clean `docker pull` on prod. Free robustness.
          provenance: false
          sbom: false

      - name: Deploy to iqlabs-prod-01
        # The deploy key is an isolated ed25519 key whose authorized_keys entry is
        # forced-command-locked to `deploy.sh agentnet-nft-indexer` server-side, so
        # the command string we send is ignored — even a leaked key can only
        # redeploy this one service. Flip the DEPLOY_ENABLED repo variable to
        # 'true' once infra has registered the key + the three secrets below.
        if: github.ref == 'refs/heads/main' && success() && vars.DEPLOY_ENABLED == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s %s\n' "$DEPLOY_HOST" "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              iqlabs@"$DEPLOY_HOST" 'deploy agentnet-nft-indexer'
          shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
